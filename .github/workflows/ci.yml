name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Dependencies are cached by setup-gradle, so subsequent runs can build offline
          # from the cache (PRD-01 acceptance criterion 7).

      - name: Build, unit tests and lint
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee gradle-build.log

      # The repo is public: append the tail of the build log to the job summary
      # so failure causes are visible without repository admin rights.
      - name: Publish build failure summary
        if: failure()
        run: tail -n 250 gradle-build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
