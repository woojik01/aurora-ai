name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Dependencies are cached by setup-gradle, so subsequent runs can build offline
          # from the cache (PRD-01 acceptance criterion 7).

      - name: Build, unit tests and lint
        run: gradle build

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
